[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdu"
version = "0.6.0"
description = "An independently implemented coding agent with recoverable model collaboration"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agentdu = "agentdu.cli:main"
agentdu-evaluate = "agentdu.evaluation:main"
agentdu-desktop-host = "agentdu.desktop_host:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
